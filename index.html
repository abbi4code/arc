<!doctype html>
<html lang="en" class="dark" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Routines, daily plan and schedule." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Start the TLS handshake with Supabase while the app boots -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <title>Winter Arc</title>
    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.ts).
      try {
        var c = localStorage.getItem('theme') || 'midnight'
        if (c === 'dark') c = 'midnight'
        var id = c === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'light') : c
        var bg = { midnight: '#0b0b0f', dusk: '#262b35', forest: '#141a17', sepia: '#f3ead6', light: '#f6f6f8' }
        if (bg[id]) {
          document.documentElement.dataset.theme = id
          document.documentElement.classList.toggle('dark', ['midnight', 'dusk', 'forest'].indexOf(id) >= 0)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg[id])
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
